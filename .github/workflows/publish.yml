name: 🚀 Release & Publish to PyPI

# Fully automatic: when a push to main changes pyproject.toml's version to one that
# has no `v<version>` tag yet, this workflow tests the commit, publishes it to PyPI,
# then creates the tag and the GitHub Release, with notes taken from CHANGELOG.md.
# Pushes that don't change the version skip every job after `detect`.
#
# Don't tag or create Releases by hand. To release: bump the version in
# pyproject.toml and CITATION.cff, date the CHANGELOG.md section, and merge to main.
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases at once, and never cancel one that's in flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: 🔖 Detect version bump
    # Releases come from main only. Without this, "Run workflow" on a feature branch
    # whose version isn't tagged yet would publish that branch to PyPI.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🧰 Set up Python 3.12 and packaging
        uses: ./.github/actions/setup-python-env
        with:
          install: packaging

      # Skips the release if tag v<version> exists, and fails if the version isn't higher
      # than the latest tag (PEP 440 order). Logic: scripts/dev.py release_decision.
      - name: 🔍 Compare version with existing tags
        id: check
        run: python scripts/dev.py release-check

      - name: 📝 Check CHANGELOG and CITATION, generate release notes
        if: steps.check.outputs.release == 'true'
        run: python scripts/dev.py release-notes --output release-notes.md

      - name: 📤 Upload release notes
        if: steps.check.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  test:
    name: 🧪 Test release commit
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🧰 Set up Python 3.12 and dependencies
        uses: ./.github/actions/setup-python-env

      - name: 🧪 Run test suite
        run: pytest tests/ -v

  pypi-publish:
    name: 📦 Build & upload to PyPI
    needs: [detect, test]
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🧰 Set up Python 3.12 and build tooling
        uses: ./.github/actions/setup-python-env
        with:
          install: build twine

      - name: 🏗️ Build sdist and wheel
        run: python -m build

      - name: ✅ Validate package metadata
        run: twine check --strict dist/*

      - name: 📤 Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      # skip-existing keeps a re-run idempotent: if PyPI succeeded but the
      # GitHub Release step failed, re-running the workflow finishes the job.
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: 🏷️ Tag & create GitHub Release
    needs: [detect, pypi-publish]
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: 📥 Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: 🏷️ Create tag and release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          prerelease=""
          if [[ "${VERSION}" =~ [a-zA-Z] ]]; then
            prerelease="--prerelease"   # e.g. 0.4.0rc1
          fi
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            ${prerelease}
