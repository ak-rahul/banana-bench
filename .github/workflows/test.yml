name: 🧪 Tests

# Skip runs whose changes can't affect the package or its tests (docs, metadata,
# examples, dev tooling). A push or PR that also touches anything else still runs.
# Keep this list in sync with quality.yml's.
on:
  push:
    paths-ignore: &ignored
      - 'docs/**'
      - '**/*.md'
      - 'examples/**'
      - 'scripts/**'
      - 'justfile'
      - 'CITATION.cff'
      - '.readthedocs.yaml'
      - '.github/dependabot.yml'
      - '.github/workflows/publish.yml'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [ main ]
    paths-ignore: *ignored
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🐍 Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: 🧪 Run test suite with coverage
      run: |
        pytest tests/ -v --cov=bananabench --cov-report=xml

    - name: 📊 Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
