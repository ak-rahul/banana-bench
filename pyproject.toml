[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banana-bench"
version = "0.1.0"
description = "A collection of 55+ standard mathematical benchmark functions for testing and evaluating optimization algorithms."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "AK Rahul", email = "ak-rahul@users.noreply.github.com"}
]
maintainers = [
    {name = "AK Rahul", email = "ak-rahul@users.noreply.github.com"}
]
keywords = [
    "optimization",
    "benchmark",
    "test-functions",
    "mathematical-optimization",
    "global-optimization",
    "algorithms",
    "machine-learning",
    "numerical-optimization",
    "metaheuristics",
    "visualization",
    "benchmarking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.3.0",
]
parallel = [
    "joblib>=1.2.0",
]
progress = [
    "tqdm>=4.65.0",
]
interactive = [
    "plotly>=5.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0,<3.0.0",
    "matplotlib>=3.3.0",
    "tqdm>=4.65.0",
    "joblib>=1.2.0",
    "scipy>=1.7.0",
    "plotly>=5.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
]
all = [
    "matplotlib>=3.3.0",
    "tqdm>=4.65.0",
    "joblib>=1.2.0",
    "scipy>=1.7.0",
    "plotly>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/ak-rahul/banana-bench"
Repository = "https://github.com/ak-rahul/banana-bench"
"Bug Tracker" = "https://github.com/ak-rahul/banana-bench/issues"

[project.scripts]
banana-bench = "bananabench.cli:main"

[tool.setuptools]
packages = ["bananabench"]

[tool.setuptools.package-data]
bananabench = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E203", "E501", "F541", "E722", "E731"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"bananabench/metadata.py" = ["F401", "F403", "F405"]
"bananabench/functions.py" = ["E203"]
"bananabench/visualization.py" = ["E722", "F811", "F841", "F401"]
"bananabench/benchmarking.py" = ["F401", "F541"]
"bananabench/cli.py" = ["F401"]
"bananabench/utils.py" = ["F401"]
"tests/*.py" = ["F401", "F811"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["no-any-return", "var-annotated", "no-redef", "assignment", "call-overload"]

[tool.coverage.run]
source = ["bananabench"]
omit = ["*/tests/*", "*/test_*.py"]
